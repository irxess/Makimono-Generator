recipe: Oatmeal (Havregrøt)

description: "An interesting variant is using steel cut oats. In that case take half of the liquid, substitute it with water, and soak the oats in for 24 hours. The day after give them a stir to distribute the starch a bit, add the other half of the liquid, and bring it to a boil. Towards the end add the salt."
